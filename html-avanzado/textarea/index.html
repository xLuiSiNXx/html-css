<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TEXAREA</title>
    <link rel="stylesheet" href="styles.css">

</head>
<body>
     
    <form> 
       <h2>
            Formulario de contacto
        </h2>
        <div class="form_input">
            <label for="nombre">Nombre:</label> 
            <input type="text" placeholder="jon snow" id="nombre">
        </div>
        <div class="form_input"> 
            <label for="correo">Correo:</label>                  
            <input type="email" placeholder="ejemplo@dominio.com" id="correo">
        </div>
            <div class="form_input">
            <label for="mensaje">Mensaje:</label>
            <textarea maxlength="200" rows="4" placeholder="Escribe tu mensaje aquí..." id="mensaje"></textarea>
        </div>
        <div class="boton_input">
            <input type="submit" value="Enviar">    
        </div>
        <div class="boton_input">
            <label>Acepto los términos y condiciones
                <input type="checkbox" class="checkbox">
            </label>
</body>
</html>
